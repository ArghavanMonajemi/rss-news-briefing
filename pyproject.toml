[project]
name = "rss-news-briefing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "example", email = "example@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "feedparser>=6.0.14",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-decouple>=3.8",
    "requests>=2.34.2",
    "trafilatura>=2.3.1",
]

[project.scripts]
rss-news-briefing = "rss_news_briefing:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
